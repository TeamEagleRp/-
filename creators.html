<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء الطالبين | رحلة التراث الفلسطيني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: #131924;
      --bg-card-hover: #1a2232;
      --gold: #e5b84b;
      --gold-light: #f8d678;
      --gold-glow: rgba(229, 184, 75, 0.25);
      --green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-subtle: rgba(229, 184, 75, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 18% 18%, rgba(229, 184, 75, 0.08) 0%, transparent 42%),
        radial-gradient(circle at 82% 82%, rgba(16, 185, 129, 0.06) 0%, transparent 42%),
        repeating-linear-gradient(45deg, rgba(229, 184, 75, 0.02) 0px, rgba(229, 184, 75, 0.02) 2px, transparent 2px, transparent 16px),
        repeating-linear-gradient(-45deg, rgba(229, 184, 75, 0.02) 0px, rgba(229, 184, 75, 0.02) 2px, transparent 2px, transparent 16px);
    }

    .tatreez-strip {
      height: 6px;
      width: 100%;
      background: repeating-linear-gradient(
        90deg,
        #b91c1c 0px, #b91c1c 12px,
        #e5b84b 12px, #e5b84b 18px,
        #10b981 18px, #10b981 30px,
        #0b0e14 30px, #0b0e14 36px
      );
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 14, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), #b4821e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #0b0e14;
      font-weight: 900;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .brand-text h1 {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--gold-light);
      line-height: 1.25;
    }

    .brand-text span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-home {
      background: linear-gradient(135deg, var(--gold), #c89628);
      color: #0b0e14;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(229, 184, 75, 0.3);
    }

    .container {
      flex: 1;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2.25rem;
      animation: fadeDown 0.55s ease;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      background: rgba(229, 184, 75, 0.12);
      border: 1px solid rgba(229, 184, 75, 0.35);
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .page-header h2 {
      font-family: 'Amiri', serif;
      font-size: clamp(2rem, 4vw, 2.85rem);
      color: #fff;
      margin-bottom: 0.45rem;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .creator-card {
      background: linear-gradient(180deg, var(--bg-card) 0%, #0f141e 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 1.8rem 1.5rem;
      text-align: center;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      animation: fadeUp 0.6s ease;
    }

    .creator-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45), 0 0 18px rgba(229, 184, 75, 0.14);
    }

    .student-tag {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--gold-light);
      background: rgba(229, 184, 75, 0.12);
      border: 1px solid rgba(229, 184, 75, 0.28);
      padding: 0.25rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .student-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.65rem;
    }

    .student-role {
      font-size: 0.98rem;
      font-weight: 700;
      color: #34d399;
    }

    .credits-summary {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .credit-item strong {
      display: block;
      color: var(--gold-light);
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
    }

    .credit-item span {
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
    }

    footer {
      text-align: center;
      padding: 1.8rem 1rem;
      color: var(--text-muted);
      font-size: 0.92rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(11, 14, 20, 0.7);
    }

    .footer-title {
      font-weight: 800;
      color: var(--gold-light);
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .footer-school {
      color: var(--text-muted);
      font-weight: 700;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="tatreez-strip"></div>

  <header class="navbar">
    <a class="brand" href="index.html">
      <div class="brand-icon">🔑</div>
      <div class="brand-text">
        <h1>رحلة التراث الفلسطيني</h1>
        <span>بوابات الأسئلة التفاعلية</span>
      </div>
    </a>

    <a class="btn-home" href="index.html">→ العودة إلى البوابات</a>
  </header>

  <main class="container">
    <div class="page-header">
      <span class="badge">✨ فريق العمل الطلابي</span>
      <h2>إنشاء الطالبين</h2>
      <p>إعداد وتطوير مشروع بوابات الأسئلة التفاعلية</p>
    </div>

    <div class="cards-grid">
      <div class="creator-card">

        <div class="student-name">عوني ابراهيم</div>
        <div class="student-role">تصميم عوني ابراهيم</div>
      </div>

      <div class="creator-card">

        <div class="student-name">محمد نصر</div>
        <div class="student-role">تنفيذ و تطوير محمد نصر</div>
      </div>
    </div>


  <footer>
    <div class="footer-title">يوم التراث الفلسطيني</div>
    <div class="footer-school"> مدرسة بيت الحكمه الإعدادية - الناصره</div>
  </footer>

</body>
</html>
